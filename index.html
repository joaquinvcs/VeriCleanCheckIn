<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Check-In Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: navy header band, a status-tile row, then a two-part body: accounts (left) and the action lists (right); one column on phones. */
:root{
  --navy:#17324A; --navy2:#234A68; --accent:#1D5C7A; --ink:#1B2124; --muted:#5F6B71; --rule:#DDE2E5;
  --bg:#F3F5F7; --card:#FFFFFF; --band:#F2F5F7;
  --green:#2F6B3A; --greenbg:#E5F1E6; --blue:#1D5C7A; --bluebg:#E3EEF4; --amber:#9A5B00; --amberbg:#FDF1DC;
  --red:#B3261E; --redbg:#FBE9E7; --gray:#9AA5AB; --graybg:#ECEFF1;
  --display:"Roboto Condensed","Arial Narrow",Arial,sans-serif; --body:Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --ink:#E6ECEF; --muted:#9FB0B9; --rule:#2C3A44; --bg:#0F1A22; --card:#16232D; --band:#1B2A35;
  --green:#7CC48A; --greenbg:#1D3524; --blue:#7DB8D6; --bluebg:#173040; --amber:#F0B45A; --amberbg:#3A2A10;
  --red:#F08A80; --redbg:#3C1C1A; --gray:#6E7F88; --graybg:#22313B; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--navy);color:#fff}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{flex:none;width:64px;height:auto;background:#fff;border-radius:8px;padding:4px;display:block}
@media (max-width:560px){.logo{width:50px}}
header .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-block:22px 20px}
h1{font:700 28px/1.1 var(--display);margin:0;letter-spacing:.2px;text-wrap:balance}
.sub{color:#C9D6E0;margin-top:6px;font-size:13px}
.fresh{display:flex;align-items:center;gap:10px;background:var(--navy2);border-radius:999px;padding:7px 14px 7px 12px;font-size:13px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#5FD07A;box-shadow:0 0 0 0 rgba(95,208,122,.6);animation:pulse 2s infinite}
.fresh.stale .dot{background:#F0B45A;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(95,208,122,0)}100%{box-shadow:0 0 0 0 rgba(95,208,122,0)}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:-1px;padding-block:18px}
.tile{background:var(--card);border-radius:6px;padding:14px 16px 12px;border-top:4px solid var(--c);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .lab{font:600 11px/1.2 var(--display);letter-spacing:.8px;text-transform:uppercase;color:var(--c)}
.tile .num{font:700 34px/1.05 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.tile .pct{font:600 15px var(--display);color:var(--c)}
.tile .note{font-size:12px;color:var(--muted)}
.t-sched{--c:var(--navy2)} .t-in{--c:var(--green)} .t-full{--c:var(--green)} .t-on{--c:var(--blue)} .t-ns{--c:var(--red)} .t-miss{--c:var(--amber)}
@media (prefers-color-scheme: dark){.t-sched{--c:#9FC1DA}}
.bld{background:var(--card);border-radius:6px;padding:12px 16px;margin:-6px 0 16px;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;font-size:13.5px;color:var(--muted)}
.bld b{font:700 18px var(--display);color:var(--ink);font-variant-numeric:tabular-nums;margin-right:4px}
.bld .day{font:700 13px var(--display);letter-spacing:.8px;text-transform:uppercase;color:var(--navy2)}
@media (prefers-color-scheme: dark){.bld .day{color:#9FC1DA}}
.scope{padding:16px 0 0;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.scope b{color:var(--ink);font:700 15px var(--display);letter-spacing:.2px}
.scope .clear{padding:2px 4px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-bottom:14px}
.filters label{font:600 11px var(--display);letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
select,input[type=search]{font:14px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;min-width:0}
input[type=search]{flex:1 1 220px;max-width:320px}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.clear{background:none;border:0;color:var(--accent);font:500 13px var(--body);cursor:pointer;padding:6px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;padding-bottom:40px}
.card{background:var(--card);border-radius:6px;min-width:0}
.card h2{font:700 16px var(--display);letter-spacing:.3px;margin:0;padding:14px 16px 10px;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font:400 12px var(--body);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 16px 10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.acct{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 16px;border-top:1px solid var(--rule);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit}
.acct:hover{background:var(--band)} .acct.sel{background:var(--bluebg)}
.acct .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .cnt{font:600 13px var(--display);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.acct .cnt b{color:var(--ink)}
.bar{grid-column:1/-1;display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--graybg)}
.bar span{display:block;height:100%}
.flags{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.pill{font:600 11px var(--display);letter-spacing:.3px;padding:2px 7px;border-radius:999px;white-space:nowrap}
.p-ns{background:var(--redbg);color:var(--red)} .p-on{background:var(--bluebg);color:var(--blue)} .p-miss{background:var(--amberbg);color:var(--amber)} .p-up{background:var(--graybg);color:var(--muted)} .p-late{background:var(--amberbg);color:var(--amber)}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 10px 9px;font:600 14px var(--display);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab .n{display:inline-block;min-width:22px;padding:1px 6px;margin-left:5px;border-radius:999px;background:var(--graybg);color:var(--muted);font-size:12px;text-align:center}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--tc)}
.tab[aria-selected=true] .n{background:var(--tc);color:#fff}
.tab.k-ns{--tc:var(--red)} .tab.k-done{--tc:var(--green)} .tab.k-hrs{--tc:var(--navy2)} .tab.k-on{--tc:var(--blue)} .tab.k-miss{--tc:var(--amber)} .tab.k-late{--tc:var(--amber)} .tab.k-up{--tc:var(--gray)}
.desc{padding:10px 16px 4px;color:var(--muted);font-size:12.5px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font:600 11px var(--display);letter-spacing:.8px;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 16px 6px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 16px;border-bottom:1px solid var(--rule);vertical-align:top}
td.who{font-weight:500;border-left:3px solid var(--tc,transparent)}
td.more{color:var(--muted);font-size:12.5px}
td .s2{display:block;color:var(--muted);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.showall{display:block;margin:10px auto 14px;background:var(--band);border:1px solid var(--rule);color:var(--ink);border-radius:6px;padding:8px 14px;font:500 13px var(--body);cursor:pointer}
.msg{background:var(--card);border-radius:6px;padding:28px 18px;margin:18px 0;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:12px;padding-block:0 32px}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:minmax(0,1fr)}.grid>section:last-child{order:-1}}
@media (max-width:560px){
  h1{font-size:23px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{padding:10px 12px}.tile .num{font-size:28px}
  thead{display:none} table,tbody,tr,td{display:block} tr{border-bottom:1px solid var(--rule);padding:8px 0;border-left:3px solid var(--tc,transparent)}
  td{border:0;padding:1px 14px} td.who{border:0;font-size:14.5px}
}
</style>
</head>

<main class="wrap">
  <div class="msg" id="msg">Loading the latest check-ins…</div>
  <div id="app" hidden>
  <div class="scope" id="scope" hidden></div>

  </div>

    <section class="card" aria-labelledby="g-h">

        <span><i style="background:var(--green)"></i>Done (in + out)</span>
        <span><i style="background:var(--blue)"></i>On site now</span>

        <span><i style="background:var(--red)"></i>No-show</span>
        <span><i style="background:var(--gray)"></i>Not started</span>

<script>
var DATA = null;
var STATE = {tab:"ns", group:"", q:"", all:false};
var TABS = [
  {k:"ns",   key:"noshow",   label:"No-shows",          cls:"k-ns",   desc:"Scheduled, but never checked in.", cols:["Cleaner","Location","Scheduled"]},
  {k:"done", key:"done",     label:"Full in + out",     cls:"k-done", desc:"Checked in and checked out correctly on every scheduled shift.", cols:["Cleaner","Location","Hours worked"]},
  {k:"on",   key:"onsite",  label:"On site now",       cls:"k-on",   desc:"Checked in and still on the clock, including people clocked in without a matching shift on the schedule.", cols:["Cleaner","Location","Checked in"]},
  {k:"miss", key:"forgot",   label:"Missed check-out",  cls:"k-miss", desc:"Checked in, but never checked out. The app closed the shift on its own.", cols:["Cleaner","Location","Checked in"]},
  {k:"late", key:"late",     label:"Late",              cls:"k-late", desc:"Checked in after the scheduled start.", cols:["Cleaner","Location","Minutes late"]},
  {k:"hrs",  key:"hours",    label:"Hours",             cls:"k-hrs",  desc:"Time on the clock in the last 24 hours, and for the week so far (Monday to now). Over 40 hours this week is overtime. More than 12 hours in a row usually means a missed check-out.", cols:["Cleaner","Last 24 hours","This week"]},
  {k:"up",   key:"upcoming", label:"Starting soon",     cls:"k-up",   desc:"Shifts starting in the next 4 hours that have not begun.", cols:["Cleaner","Location","Scheduled"]}
];
var LIMIT = 40;

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function pct(a,b){return b?Math.round(100*a/b)+"%":"–";}
function el(id){return document.getElementById(id);}
var MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function tsOf(s){var m=String(s||"").match(/(\w{3}) (\d+), (\d+):(\d+) (AM|PM)/); if(!m) return null;
  var h=(+m[3])%12+(m[5]==="PM"?12:0), y=new Date(DATA.gen_ts*1000).getFullYear();
  return new Date(y, MON[m[1]], +m[2], h, +m[4]).getTime();}
function worked(a,b){var x=tsOf(a), y=tsOf(b); if(x==null||y==null) return null; var d=(y-x)/3600000; if(d<0) d+=24; return d;}
function hrs(h){h=+h||0; var H=Math.floor(h), M=Math.round((h-H)*60); if(M===60){H++;M=0;} return H+" h "+(M<10?"0":"")+M+" m";}

// One row per cleaner: merge the extra sites a person had in the same check.
function merged(key){
  var rows = DATA[key] || [], out = [], idx = {};
  if (key === "hours") return rows.map(function(r){return {name:r[0], group:r[1], site:"", h:r[2], wk:r[3], on:r[4], n:r[5]};});
  rows.forEach(function(r){
    var site = String(r[2]||""), extra = 0, m = site.match(/^(.*?)\s+\+(\d+) more$/);
    if (m){site = m[1]; extra = +m[2];}
    var id = r[0]+"|"+r[1]+"|"+(key==="late"?r[3]:(r[3]||""));
    if (idx[id]!=null){out[idx[id]].extra += 1 + extra; return;}
    idx[id] = out.length;
    out.push({name:r[0], group:r[1], site:site, extra:extra, t:r[3], x:r[4]});
  });
  return out;
}
function filtered(key){
  var q = STATE.q.toLowerCase();
  return merged(key).filter(function(r){
    return (!STATE.group || r.group===STATE.group) &&
           (!q || (r.name+" "+r.site).toLowerCase().indexOf(q) >= 0);
  });
}
function countBy(key){var c={}; merged(key).forEach(function(r){c[r.group]=(c[r.group]||0)+1;}); return c;}

function renderHeader(){
  document.title = DATA.title;
  el("title").textContent = DATA.title;
  el("window").textContent = DATA.window.replace("Shifts starting","Shifts starting between") + "  ·  Central Time";
  var mins = Math.max(0, Math.round((Date.now()/1000 - DATA.gen_ts)/60));
  var ago = mins < 1 ? "just now" : mins < 60 ? mins+" min ago" : Math.floor(mins/60)+" h "+(mins%60)+" min ago";
  el("freshtxt").textContent = "Updated " + DATA.generated.replace(/^\w+ \w+ \d+, /,"") + "  ·  " + ago;
  el("fresh").classList.toggle("stale", mins > 90);
  el("fresh").title = mins > 90 ? "The next update is overdue." : "Refreshes every hour.";
}
// Summary numbers for everyone, or for the account / state picked in the filter.
function cur(){
  var t = DATA.tot; if (!STATE.group) return t;
  var g = DATA.groups.filter(function(x){return x.g===STATE.group;})[0] || {sched:0,in:0,full:0,ns:0,open:0,up:0};
  function uniq(k){var s={}; (DATA[k]||[]).forEach(function(r){ if (r[1]===STATE.group) s[r[0]]=1; }); return Object.keys(s).length;}
  var b = DATA.bld_by ? (DATA.bld_by[STATE.group] || [0,0,0]) : null;
  return {sched:g.sched, "in":g["in"], full:g.full, ns:g.ns, onsite:uniq("onsite"), forgot:uniq("forgot"), upcoming:g.up,
          day:t.day, bld_sched:b ? b[0] : null, bld_started:b ? b[1] : 0, bld_done:b ? b[2] : 0};
}
function renderTiles(){
  var t = cur(), S = t.sched;
  el("scope").hidden = !STATE.group;
  el("scope").innerHTML = STATE.group ? 'Showing <b>'+esc(STATE.group)+'</b> only<button type="button" class="clear" id="scope-clear">Show all</button>' : "";
  var tiles = [
    ["t-sched","Scheduled", t.sched, "", (t.upcoming? t.upcoming+" more starting soon" : "cleaners with a shift")],
    ["t-in","Checked in", t.in, pct(t.in,S), "of scheduled"],
    ["t-full","Done (in + out)", t.full, pct(t.full,S), "of scheduled"],
    ["t-on","On site now", t.onsite, "", "on the clock right now"],
    ["t-ns","No-show", t.ns, pct(t.ns,S), "of scheduled"],
    ["t-miss","Missed check-out", t.forgot, pct(t.forgot,S), "of scheduled"]
  ];
  el("tiles").innerHTML = tiles.map(function(x){
    return '<div class="tile '+x[0]+'"><span class="lab">'+x[1]+'</span><span class="num">'+x[2].toLocaleString()+'</span>'+
      '<span class="pct">'+(x[3]||"&nbsp;")+'</span><span class="note">'+x[4]+'</span></div>';
  }).join("");
}
function renderBld(){
  var t = cur(), B = t.bld_sched;
  if (B == null){el("bld").hidden = true; return;}
  var miss = Math.max(0, (t.bld_started||0) - (t.bld_done||0)), later = Math.max(0, B - (t.bld_started||0));
  el("bld").hidden = false;
  el("bld").innerHTML = '<span class="day">'+esc(t.day)+' · buildings today'+(STATE.group?' · '+esc(STATE.group):'')+'</span>'+
    '<span><b>'+B+'</b>scheduled</span>'+
    '<span><b style="color:var(--green)">'+(t.bld_done||0)+'</b>checked in ('+pct(t.bld_done||0,B)+')</span>'+
    '<span><b style="color:var(--red)">'+miss+'</b>shift started, no check-in yet</span>'+
    '<span><b>'+later+'</b>later today</span>';
}
function renderFilters(){
  var unit = DATA.unit, sel = el("f-group");
  el("f-label").textContent = unit;
  el("g-title").textContent = "By " + unit.toLowerCase();
  var gs = DATA.groups.map(function(g){return g.g;});
  sel.innerHTML = '<option value="">All '+(unit==="State"?"states":"accounts")+'</option>' +
    gs.map(function(g){return '<option'+(g===STATE.group?' selected':'')+'>'+esc(g)+'</option>';}).join("");
  el("f-clear").hidden = !(STATE.group || STATE.q);
}
function renderGroups(){
  var on = countBy("onsite"), miss = countBy("forgot");
  el("groups").innerHTML = DATA.groups.map(function(g){
    var total = g.sched + g.up || 1, o = Math.min(on[g.g]||0, g.open), m = Math.max(0, g.open - o),
        other = Math.max(0, g.in - g.full - g.open);
    var seg = [[g.full+other,"var(--green)"],[o,"var(--blue)"],[m,"var(--amber)"],[g.ns,"var(--red)"],[g.up,"var(--gray)"]];
    var flags = [];
    if (g.ns) flags.push('<span class="pill p-ns">'+g.ns+' no-show</span>');
    if (o) flags.push('<span class="pill p-on">'+o+' on site</span>');
    if (m) flags.push('<span class="pill p-miss">'+m+' missed check-out</span>');
    if (g.up) flags.push('<span class="pill p-up">'+g.up+' starting soon</span>');
    return '<button type="button" class="acct'+(g.g===STATE.group?' sel':'')+'" data-g="'+esc(g.g)+'">'+
      '<span class="name">'+esc(g.g)+'</span><span class="cnt"><b>'+(g.full)+'</b> of '+g.sched+' done · '+pct(g.full,g.sched)+'</span>'+
      '<span class="bar" aria-hidden="true">'+seg.map(function(s){return s[0]?'<span style="width:'+(100*s[0]/total)+'%;background:'+s[1]+'"></span>':'';}).join("")+'</span>'+
      (flags.length?'<span class="flags">'+flags.join("")+'</span>':'')+'</button>';
  }).join("") || '<div class="empty">Nobody scheduled in this window.</div>';
}
function renderTabs(){
  el("tabs").innerHTML = TABS.map(function(t){
    return '<button type="button" role="tab" class="tab '+t.cls+'" data-k="'+t.k+'" aria-selected="'+(t.k===STATE.tab)+'">'+t.label+
      '<span class="n">'+filtered(t.key).length+'</span></button>';
  }).join("");
}
function renderList(){
  var T = TABS.filter(function(t){return t.k===STATE.tab;})[0], rows = filtered(T.key);
  var dtxt = T.desc;
  if (T.k==="done" && rows.length){var tot=0, ppl={}; rows.forEach(function(r){var w=worked(r.t,r.x); if(w!=null) tot+=w; ppl[r.name]=1;});
    dtxt += " Total: "+hrs(tot)+" worked by "+Object.keys(ppl).length+" cleaners.";}
  el("desc").textContent = dtxt;
  if (!rows.length){el("list").innerHTML = '<div class="empty">'+(STATE.group||STATE.q?"No one matches these filters.":"No one in this list right now.")+'</div>'; return;}
  var shown = STATE.all ? rows : rows.slice(0, LIMIT), tc = getComputedStyle(document.querySelector(".tab."+T.cls)).getPropertyValue("--tc");
  var html = '<table><thead><tr><th>'+T.cols[0]+'</th><th>'+T.cols[1]+'</th><th>'+T.cols[2]+'</th></tr></thead><tbody>' +
    shown.map(function(r){
      if (T.k==="hrs"){
        var long = r.h >= 12 && r.n <= 1, ot = r.wk > 40, near = r.wk >= 36;
        return '<tr style="--tc:'+tc+'"><td class="who">'+esc(r.name)+'<span class="s2">'+esc(r.group)+'</span></td>'+
          '<td><span class="num">'+hrs(r.h)+'</span>'+(r.on?' <span class="pill p-on">on the clock</span>':'')+
          (long?'<span class="s2" style="color:var(--amber)">Check clock-out</span>':'')+'</td>'+
          '<td><span class="num"'+(ot?' style="color:var(--red);font-weight:700"':near?' style="color:var(--amber);font-weight:700"':'')+'>'+hrs(r.wk)+'</span>'+
          (ot?' <span class="pill p-ns">overtime</span>':near?' <span class="pill p-late">near 40</span>':'')+'</td></tr>';
      }
      var when = T.k==="late" ? '<span class="num">'+r.x+' min</span><span class="s2">'+esc(r.t)+'</span>'
               : T.k==="done" ? (function(){var w=worked(r.t,r.x); return (w!=null?'<span class="num" style="font-weight:700">'+hrs(w)+'</span>':'')+
                   '<span class="s2">'+esc(String(r.t).replace(/^\w+ \w+ \d+, /,""))+' → '+esc(String(r.x||"").replace(/^\w+ \w+ \d+, /,""))+'</span>';})()
               : T.k==="on" && r.x==="Not matched to a shift" ? esc(r.t)+' <span class="pill p-late">not on schedule</span>'
               : esc(r.t);
      return '<tr style="--tc:'+tc+'"><td class="who">'+esc(r.name)+'<span class="s2">'+esc(r.group)+'</span></td>'+
        '<td>'+esc(r.site)+(r.extra?'<span class="s2">+'+r.extra+' more location'+(r.extra>1?'s':'')+'</span>':'')+'</td><td>'+when+'</td></tr>';
    }).join("") + '</tbody></table>';
  if (rows.length > shown.length) html += '<button type="button" class="showall" id="showall">Show all '+rows.length+'</button>';
  el("list").innerHTML = html;
}
function renderFoot(){
  var t = DATA.tot;
  el("foot").textContent = t.locations+" locations in the account (scheduled in the last 4 weeks)  ·  "+t.sched+" of "+t.cleaners+
    " cleaners scheduled  ·  Source: Connecteam, refreshed every hour  ·  Percentages are of scheduled cleaners.";
}
function render(){
  el("msg").hidden = true; el("app").hidden = false;
  renderHeader(); renderTiles(); renderBld(); renderFilters(); renderGroups(); renderTabs(); renderList(); renderFoot();
}

document.addEventListener("click", function(e){
  if (!DATA) return;
  var a = e.target.closest(".acct"), t = e.target.closest(".tab");
  if (a){STATE.group = STATE.group===a.dataset.g ? "" : a.dataset.g; STATE.all=false; render(); return;}
  if (t){STATE.tab = t.dataset.k; STATE.all=false; renderTabs(); renderList(); return;}
  if (e.target.id==="showall"){STATE.all=true; renderList(); return;}
  if (e.target.id==="f-clear" || e.target.id==="scope-clear"){STATE.group=""; STATE.q=""; el("f-q").value=""; render();}
});
el("f-group").addEventListener("change", function(){STATE.group=this.value; STATE.all=false; render();});
el("f-q").addEventListener("input", function(){STATE.q=this.value.trim(); STATE.all=false; renderFilters(); renderTabs(); renderList();});

// The tracker key travels in the link after "#k=", so it never reaches this site's server and is not in the page code.
var KEY = (location.hash.match(/[#&]k=([\w-]+)/) || [])[1];
var SRC = KEY ? "https://script.google.com/macros/s/" + KEY + "/exec?format=json" : null;
function showMsg(t){ el("msg").textContent = t; el("msg").hidden = false; el("app").hidden = true; el("freshtxt").textContent = "Not loaded"; el("fresh").classList.add("stale"); }
function load(){
  if (!SRC){ showMsg("This link is incomplete. Ask VeriClean for the full tracker link."); return; }
  fetch(SRC + "&t=" + Date.now(), {credentials: "omit", cache: "no-store"})
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ if (!d || !d.tot) throw new Error("empty"); DATA = d; render(); })
    .catch(function(){ if (DATA) renderHeader(); else showMsg("Could not load the tracker right now. Check the connection and pull down to reload."); });
}
load();
// Keep the open page current: re-read the latest snapshot every 5 minutes, and when the phone comes back to this tab.
setInterval(load, 5*60*1000);
document.addEventListener("visibilitychange", function(){ if (!document.hidden) load(); });
window.addEventListener("hashchange", function(){ location.reload(); });
</script>
